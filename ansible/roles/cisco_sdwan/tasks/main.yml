# cisco_sdwan role – orchestrate sub-tasks in order
- name: Include vManage authentication tasks
  ansible.builtin.include_tasks: auth.yml

- name: Include device template tasks
  ansible.builtin.include_tasks: templates.yml

- name: Include template attachment tasks
  ansible.builtin.include_tasks: attachments.yml

- name: Include centralized policy tasks
  ansible.builtin.include_tasks: policy.yml
