---
# cisco_meraki role – orchestrate sub-tasks in order
- name: Include network provisioning tasks
  ansible.builtin.include_tasks: networks.yml

- name: Include firewall rule tasks
  ansible.builtin.include_tasks: firewall.yml

- name: Include content filtering tasks
  ansible.builtin.include_tasks: content_filtering.yml

- name: Include AutoVPN tasks
  ansible.builtin.include_tasks: autovpn.yml

- name: Include VLAN tasks
  ansible.builtin.include_tasks: vlans.yml
