---
all:
  children:

    cisco_meraki:
      hosts:
        meraki_dashboard:
          # Meraki collection connects to the Dashboard API – no real SSH host needed.
          # Authentication is handled via the MERAKI_DASHBOARD_API_KEY environment variable
          # or the meraki_api_key group/host variable.
          ansible_connection: local

    cisco_sdwan:
      hosts:
        vmanage_controller:
          # Catalyst SD-WAN vManage controller
          ansible_host: "{{ vmanage_host }}"
          ansible_connection: local

    paloalto:
      hosts:
        panorama:
          # Panorama management server
          ansible_host: "{{ panorama_host }}"
          ansible_connection: local

        pa_fw_01:
          # Standalone PAN-OS firewall
          ansible_host: "{{ pa_fw_01_host }}"
          ansible_connection: local
