---
# Palo Alto Networks group variables
# Panorama / firewall connection details (use Vault for credentials).

# panorama_host: "198.51.100.20"
# pa_fw_01_host: "198.51.100.21"
# panos_username: "{{ lookup('env', 'PANOS_USERNAME') }}"
# panos_password: "{{ lookup('env', 'PANOS_PASSWORD') }}"

panos_validate_certs: true

# Default vsys for policy/object operations
panos_vsys: "vsys1"

# Commit timeout (seconds)
panos_commit_timeout: 300
